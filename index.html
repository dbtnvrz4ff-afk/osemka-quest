<title>Ósemka Quest 🚀</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f0ff;--card:#fff;--ink:#241a44;--mut:#6b6390;--pri:#7c3aed;--acc:#ff7a59;--ok:#16a34a;--bad:#e11d48;--line:#e4dcff;--m:#2563eb;--p:#db2777}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16102b;--card:#231a44;--ink:#f3eeff;--mut:#a89ed0;--line:#3a2d6b;--pri:#a78bfa;--m:#60a5fa;--p:#f472b6}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .4s}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
button:active{transform:translateY(2px);box-shadow:none}
.big{width:100%;text-align:left;font-size:1.05rem;margin:7px 0}
.pri{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 3px 0 rgba(0,0,0,.25);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:700;margin-right:6px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.q{font-size:1.15rem;line-height:1.5;margin:10px 0}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.b{padding:6px 10px;border-radius:14px;background:var(--line);font-size:.9rem;opacity:.45}
.b.on{opacity:1;background:var(--acc);color:#fff}
.mut{color:var(--mut);font-size:.9rem}
.fb{margin-top:10px;padding:12px;border-radius:14px;background:var(--line);line-height:1.6}
.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
</head>

var PF=["1 – P, 2 – P","1 – P, 2 – F","1 – F, 2 – P","1 – F, 2 – F"],AB=["A i C","A i D","B i C","B i D"];
var Q=[
["m","Potęgi","Wartość wyrażenia 4³ − 8² : 2⁴ jest równa",["0","10","56","60"],3,"1) 4³ = 64, a 8² = 64\n2) Najpierw dzielenie: 64 : 2⁴ = 64 : 16 = 4\n3) 64 − 4 = 60","Styczeń 2026"],
["m","Zadania tekstowe","Uczniowie klas 8A, 8B i 8C zebrali razem 132,9 kg makulatury. Klasy 8A i 8B razem zebrały 90,6 kg, a klasy 8B i 8C razem 86,8 kg. Ile kg zebrała klasa 8B?",["43,4","44,3","44,5","47,2"],2,"1) Klasa 8C: 132,9 − 90,6 = 42,3 kg\n2) Klasy 8B i 8C razem to 86,8 kg, więc 8B: 86,8 − 42,3 = 44,5 kg","Styczeń 2026"],
["m","Wyrażenia algebraiczne","Aleks kupił komplet słuchawek, dwie jednakowe ładowarki i dwa jednakowe dyski USB. Dysk jest 2 razy tańszy od ładowarki, a komplet słuchawek 4 razy droższy od ładowarki. Cena ładowarki to x. Wartość zakupów opisuje wyrażenie:",["10,5x","7x","6,5x","6x"],1,"1) Ładowarki: 2 · x = 2x\n2) Dysk kosztuje x : 2, więc dwa dyski: x\n3) Słuchawki: 4x\n4) Razem: 2x + x + 4x = 7x","Styczeń 2026"],
["m","Liczby","Dane są liczby x = 5,27 · 10⁻³, y = 0,0023, z = 1400 · 10⁻⁵. Uporządkuj je od najmniejszej do największej.",["x < y < z","y < x < z","z < y < x","x < z < y"],1,"1) x = 0,00527\n2) y = 0,0023\n3) z = 1400 · 0,00001 = 0,014\n4) Kolejność: 0,0023 < 0,00527 < 0,014, czyli y < x < z","Styczeń 2026"],
["m","Statystyka","Na tablicy zapisano osiem liczb całkowitych dodatnich o średniej arytmetycznej 9. Po dopisaniu liczby 9 średnia arytmetyczna:",["wzrośnie o 1","zmaleje o 1","się nie zmieni","wzrośnie o 9"],2,"1) Suma ośmiu liczb: 8 · 9 = 72\n2) Po dopisaniu 9 suma to 81, a liczb jest 9\n3) Nowa średnia: 81 : 9 = 9, czyli bez zmian","Styczeń 2026"],
["m","Liczby","Ola otwiera szafkę kodem YXXY, gdzie X to największy wspólny dzielnik liczb 18 i 27, a Y to najmniejsza wspólna wielokrotność liczb 2 i 4. Jaki to kod?",["4334","4994","8338","8998"],1,"1) NWD(18, 27) = 9, więc X = 9\n2) NWW(2, 4) = 4, więc Y = 4\n3) Kod YXXY = 4994","Maj 2026"],
["m","Pierwiastki","Która z liczb jest równa 0?\nw = √(100−64) − 2,  x = 12 − √(64+36),\ny = √(25−16) − 3,  z = 7 − √(9+16)",["w","x","y","z"],2,"1) w = √36 − 2 = 6 − 2 = 4\n2) x = 12 − √100 = 2\n3) y = √9 − 3 = 3 − 3 = 0 ✔\n4) z = 7 − √25 = 2","Maj 2026"],
["m","Procenty","Rasowy kocur kosztuje x zł, a kotka y zł. Janek kupił kocura ze zniżką 40% i kotkę ze zniżką 20%. Ile zapłacił?",["0,4x + 0,2y","0,2x + 0,4y","0,8x + 0,6y","0,6x + 0,8y"],3,"1) Zniżka 40% oznacza, że płacimy 60%, czyli 0,6x\n2) Zniżka 20% oznacza, że płacimy 80%, czyli 0,8y\n3) Razem: 0,6x + 0,8y","Maj 2026"],
["m","Zadania tekstowe","Do 10 koszy włożono jabłka i pomarańcze, razem 400 sztuk. W każdym koszu jest tyle samo owoców, a jabłek jest o 6 więcej niż pomarańczy. Ile jabłek jest łącznie w 10 koszach?",["210","230","240","260"],1,"1) W jednym koszu: 400 : 10 = 40 owoców\n2) Pomarańcze p, jabłka p + 6, więc 2p + 6 = 40, czyli p = 17\n3) Jabłek w koszu: 23\n4) W 10 koszach: 230","Maj 2026"],
["m","Kąty","Kąty czworokąta to α, β, γ, δ. Kąt β jest o 70° większy od α, kąt γ jest 2 razy większy od α, a δ jest kątem prostym. Miara kąta β jest równa:",["50°","85°","120°","155°"],2,"1) Suma kątów czworokąta to 360°\n2) α + (α + 70°) + 2α + 90° = 360°\n3) 4α + 160° = 360°, więc α = 50°\n4) β = 50° + 70° = 120°","Maj 2026"],
["m","Pola figur","Przekątna AD dzieli pięciokąt na trójkąt ADE i kwadrat ABCD. Pole trójkąta ADE to 28, a jego wysokość z wierzchołka E na bok AD to 7. Pole kwadratu ABCD wynosi:",["16","32","49","64"],3,"1) Pole trójkąta = ½ · podstawa · wysokość\n2) 28 = ½ · |AD| · 7, więc |AD| = 8\n3) AD to bok kwadratu: 8 · 8 = 64","Maj 2026"],
["m","Równania","Rozwiązaniem równania 3(x + 2) = 6 − (x − 1) jest liczba:",["−3/2","−1","1/4","1/2"],2,"1) Lewa strona: 3x + 6\n2) Prawa strona: 6 − x + 1 = 7 − x\n3) 3x + 6 = 7 − x, więc 4x = 1\n4) x = 1/4","Czerwiec 2026"],
["m","Potęgi","Które wyrażenie ma największą wartość?\nI: 2²⁴ : 2   II: 4¹² · 4   III: 2²⁵ : 8   IV: (4 · 8)⁴",["I","II","III","IV"],1,"Zamieniamy na potęgi dwójki:\nI: 2²³\nII: 4¹³ = (2²)¹³ = 2²⁶\nIII: 2²⁵ : 2³ = 2²²\nIV: 32⁴ = (2⁵)⁴ = 2²⁰\nNajwiększy wykładnik ma II","Czerwiec 2026"],
["m","Kombinatoryka","Ile jest liczb czterocyfrowych, w których suma cyfr jest równa 3?",["3","6","9","10"],3,"Wypisujemy po kolei (pierwsza cyfra nie może być 0):\n1) Zaczynają się od 3: 3000\n2) Od 2: 2001, 2010, 2100\n3) Od 1: 1002, 1011, 1020, 1101, 1110, 1200\nRazem: 1 + 3 + 6 = 10","Czerwiec 2026"],
["m","Prędkość","Ala wyruszyła na rower o 11:40 i dotarła do celu o 13:00 tego samego dnia. Trasa miała 28 km. Z jaką prędkością jechała?",["10,5 km/h","12 km/h","16,8 km/h","21 km/h"],3,"1) Czas: od 11:40 do 13:00 to 1 h 20 min = 4/3 h\n2) v = s : t = 28 : 4/3\n3) 28 · 3/4 = 21 km/h","Czerwiec 2026"],
["m","Równania","Rozwiąż równanie 5(x − 1) = 2x + 7.",["2","3","4","5"],2,"1) Lewa strona: 5x − 5\n2) 5x − 5 = 2x + 7\n3) 3x = 12\n4) x = 4"],
["m","Statystyka","Klasy A i B zebrały razem 75 kg, klasy B i C razem 68 kg, a wszystkie trzy 112 kg. Ile kg zebrała klasa B?",["29","31","32","37"],1,"1) Klasa C: 112 − 75 = 37 kg\n2) Klasa B: 68 − 37 = 31 kg"],
["m","Kombinatoryka","Ile jest liczb czterocyfrowych, w których suma cyfr jest równa 2?",["3","4","5","6"],1,"Wypisujemy: 2000, 1001, 1010, 1100\nRazem 4 liczby"],
["m","Potęgi","Wartość wyrażenia 2⁶ · 4³ jest równa:",["2⁹","2¹²","2¹⁸","4⁶ · 2"],1,"1) 4³ = (2²)³ = 2⁶\n2) 2⁶ · 2⁶ = 2¹² (wykładniki dodajemy)"],
["m","Procenty","Kurtka kosztowała 300 zł. Obniżono cenę o 30%, a potem nową cenę jeszcze o 10%. Ile kosztuje teraz?",["180 zł","189 zł","195 zł","210 zł"],1,"1) Po pierwszej obniżce: 300 · 0,7 = 210 zł\n2) Po drugiej: 210 · 0,9 = 189 zł\nUwaga: to nie jest obniżka o 40%!"],
["m","Kąty","W czworokącie kąt β jest o 50° większy od α, γ jest 2 razy większy od α, a δ = 90°. Ile wynosi β?",["55°","85°","105°","125°"],2,"1) α + (α + 50°) + 2α + 90° = 360°\n2) 4α + 140° = 360°, więc α = 55°\n3) β = 55° + 50° = 105°"],
["m","Prędkość","Samochód przejechał 36 km w 45 minut. Jaka była jego średnia prędkość?",["27 km/h","48 km/h","54 km/h","81 km/h"],1,"1) 45 min = 3/4 h\n2) v = 36 : 3/4 = 36 · 4/3 = 48 km/h"],
["m","Bryły","Trzy sześciany o krawędzi 4 cm ustawiono jeden na drugim. Jakie jest pole powierzchni całkowitej powstałego prostopadłościanu?",["192 cm²","224 cm²","256 cm²","288 cm²"],1,"1) Powstaje prostopadłościan 4 × 4 × 12\n2) Pole = 2(4·4 + 4·12 + 4·12)\n3) = 2(16 + 48 + 48) = 224 cm²"],
["m","Ułamki i liczby mieszane","Wartość wyrażenia (2,4 − 5⅓) : (−2) jest równa",["−1 8/15","−1 7/15","1 7/15","1 8/15"],2,"1) 2,4 = 12/5, a 5⅓ = 16/3\n2) 12/5 − 16/3 = 36/15 − 80/15 = −44/15\n3) (−44/15) : (−2) = 44/30 = 22/15 = 1 7/15","Egzamin 2025"],
["m","Reszta z dzielenia","Która z liczb: 91, 92, 95, 97 przy dzieleniu przez 7 daje resztę 1?",["91","92","95","97"],1,"1) 91 = 7 · 13, reszta 0\n2) 92 = 91 + 1, więc reszta 1 ✔\n3) 95 daje resztę 4, a 97 resztę 6","Egzamin 2025"],
["m","Przekształcanie wzorów","Obwód pięciokąta wyraża się wzorem L = 2a + 2b + c. Wielkość a wyznaczona poprawnie to:",["a = (L − 2b − c) / 2","a = (L − 2b + c) / 2","a = L + 2b − c","a = L − 2b − c"],0,"1) Odejmujemy 2b i c od obu stron: L − 2b − c = 2a\n2) Dzielimy obie strony przez 2","Egzamin 2025"],
["m","Wyrażenia algebraiczne","W pudełku są piłki białe, fioletowe i czarne. Białych jest 4 razy więcej niż fioletowych i o 3 mniej niż czarnych. Liczba fioletowych to x. Łączną liczbę piłek opisuje wyrażenie:",["9x + 3","9x − 3","6x + 3","6x − 3"],0,"1) Fioletowe: x\n2) Białe: 4x\n3) Czarne: o 3 więcej niż białe, czyli 4x + 3\n4) Razem: x + 4x + 4x + 3 = 9x + 3","Egzamin 2025"],
["m","Potęgi","Wartość wyrażenia 8⁶ : 4³ zapisana jako potęga liczby 2 jest równa",["2²","2³","2⁴","2¹²"],3,"1) 8⁶ = (2³)⁶ = 2¹⁸\n2) 4³ = (2²)³ = 2⁶\n3) 2¹⁸ : 2⁶ = 2¹² (wykładniki odejmujemy)","Egzamin 2025"],
["m","Prędkość","Rowerzysta pokonał odcinek drogi o długości 100 m z prędkością 5 m/s. Ile to trwało?",["50 sekund","20 sekund","500 sekund","200 sekund"],1,"Ze wzoru v = s : t wynika t = s : v\nt = 100 : 5 = 20 s","Egzamin 2025"],
["m","Prawdopodobieństwo","Na loterię przygotowano 72 losy ponumerowane od 1 do 72. Wygrywają losy o numerach od 1 do 9 i od 46 do 72, pozostałe są puste. Jakie jest prawdopodobieństwo wyciągnięcia losu pustego?",["26/72","27/72","35/72","36/72"],3,"1) Wygrywających: 9 + (72 − 46 + 1) = 9 + 27 = 36\n2) Pustych: 72 − 36 = 36\n3) P = 36/72","Egzamin 2025"],
["m","Układ współrzędnych","Trzy wierzchołki równoległoboku ABCD to A = (−3, −2), C = (4, 2), D = (−1, 2). Jakie współrzędne ma wierzchołek B?",["(4, −2)","(3, −2)","(2, −2)","(6, −2)"],2,"W równoległoboku przekątne AC i BD mają wspólny środek, więc B = A + C − D.\n1) x: −3 + 4 − (−1) = 2\n2) y: −2 + 2 − 2 = −2\nB = (2, −2)","Egzamin 2025"],
["m","Bryły","Trzy krawędzie wychodzące z jednego wierzchołka prostopadłościanu mają długości 5, 6 i 7. Pole powierzchni całkowitej tego prostopadłościanu jest równe:",["107","172","210","214"],3,"Pole = 2(ab + ac + bc)\n1) 5·6 = 30, 5·7 = 35, 6·7 = 42\n2) 2 · (30 + 35 + 42) = 2 · 107 = 214","Egzamin 2025"],
["m","Średnia (dwie części)","Średnia czterech liczb a, b, c, d to 9, a średnia dwóch liczb e i f to 6.\n1) Suma a+b+c+d jest większa od sumy e+f o: A. 3  B. 24\n2) Średnia sześciu liczb a, b, c, d, e, f to: C. 8  D. 7,5",["A i C","A i D","B i C","B i D"],2,"1) Suma czterech liczb: 4 · 9 = 36, suma dwóch: 2 · 6 = 12\n2) Różnica: 36 − 12 = 24 (B)\n3) Średnia sześciu: (36 + 12) : 6 = 8 (C)","Egzamin 2025"],
["m","Zadanie P/F","K = 1/9 · √(1/16) − 1/16 · √(1/9),  L = 9 · √16 − 16 · √9\n1) Wyrażenie K ma wartość ujemną.\n2) Wartość L jest większa od wartości K.",["1 – P, 2 – P","1 – P, 2 – F","1 – F, 2 – P","1 – F, 2 – F"],3,"1) K = 1/9 · 1/4 − 1/16 · 1/3 = 1/36 − 1/48 = 1/144, to liczba dodatnia, więc 1) fałsz\n2) L = 9 · 4 − 16 · 3 = 36 − 48 = −12, a to mniej niż K, więc 2) fałsz","Egzamin 2025"],
["m","Ułamki","Wypisano ułamki, w których mianownik jest równy 4, licznik jest liczbą naturalną większą od mianownika, a każdy ułamek jest większy od 3 i mniejszy od 5. Ile jest takich ułamków?",["sześć","siedem","osiem","dziewięć"],1,"1) n/4 > 3, więc n > 12\n2) n/4 < 5, więc n < 20\n3) n = 13, 14, 15, 16, 17, 18, 19, czyli 7 ułamków","Egzamin 2024"],
["m","Przekształcanie równań","Równanie 5x = y/w (x, y, w ≠ 0). Które przekształcenia są poprawne?\nI: x = y/(5w)   II: y = 5x/w   III: w = y/(5x)",["I i II","II i III","I i III","I, II, III"],2,"1) Mnożymy przez w: 5xw = y, więc y = 5xw (II jest błędne)\n2) Dzielimy przez 5w: x = y/(5w) (I poprawne)\n3) Z 5x = y/w: w = y/(5x) (III poprawne)","Egzamin 2024"],
["m","Prawdopodobieństwo","W pudełku są balony: 10 czerwonych, 8 niebieskich, 6 zielonych i 8 żółtych. Karolina wyjmuje po jednym balonie. Pierwsze dwa były czerwone. Jakie jest prawdopodobieństwo, że trzeci też będzie czerwony?",["1/3","5/16","4/15","1/4"],2,"1) Na początku: 10 + 8 + 6 + 8 = 32 balony\n2) Po wyjęciu 2 czerwonych zostało 30 balonów, w tym 8 czerwonych\n3) P = 8/30 = 4/15","Egzamin 2024"],
["m","Wyrażenia algebraiczne","Wyrażenie x(x + 4) − 3(2x − 5) można przekształcić do postaci:",["x² + 2x − 5","x² − 2x + 5","x² + 2x − 15","x² − 2x + 15"],3,"1) x(x + 4) = x² + 4x\n2) −3(2x − 5) = −6x + 15 (uwaga na znak!)\n3) x² + 4x − 6x + 15 = x² − 2x + 15","Egzamin 2024"],
["m","Czas","Pociąg wyjechał z Olsztyna punktualnie, a do Gdyni przyjechał z 4-minutowym opóźnieniem o 17:31. Podróż planowo trwa 2 h 54 min. O której pociąg wyjechał?",["14:27","14:41","14:31","14:33"],3,"1) Planowy przyjazd: 17:31 − 4 min = 17:27\n2) Wyjazd: 17:27 − 2 h 54 min\n3) 17:27 − 3 h = 14:27, a potem +6 min = 14:33","Egzamin 2024"],
["m","Zadanie P/F","Średnia arytmetyczna liczb 12, 14 i k jest równa 16.\n1) Liczba k jest równa 22.\n2) Średnia liczb 12, 14, k, 11, 17 jest większa od 16.",["1 – P, 2 – P","1 – P, 2 – F","1 – F, 2 – P","1 – F, 2 – F"],1,"1) 12 + 14 + k = 3 · 16 = 48, więc k = 22 (1 prawda)\n2) Suma pięciu liczb: 12 + 14 + 22 + 11 + 17 = 76, średnia 76 : 5 = 15,2, a to mniej niż 16 (2 fałsz)","Egzamin 2024"],
["m","Zadanie P/F","1) Iloczyn 3 · 9⁵ jest równy 3¹¹.\n2) Wyrażenie (2⁸ · 2⁷) : 2¹⁰ można zapisać jako 2⁵.",["1 – P, 2 – P","1 – P, 2 – F","1 – F, 2 – P","1 – F, 2 – F"],0,"1) 9⁵ = (3²)⁵ = 3¹⁰, więc 3 · 3¹⁰ = 3¹¹ ✔\n2) 2⁸ · 2⁷ = 2¹⁵, a 2¹⁵ : 2¹⁰ = 2⁵ ✔","Egzamin 2024"],
["m","Ułamki (dwie części)","x = 4/5 · (−4/3),  y = 4/5 + (−4/3)\n1) Liczba y jest: A. ujemna  B. dodatnia\n2) Liczba x jest ___ od y: C. mniejsza  D. większa",["A i C","A i D","B i C","B i D"],0,"1) y = 12/15 − 20/15 = −8/15, czyli ujemna (A)\n2) x = −16/15\n3) −16/15 < −8/15, więc x jest mniejsza od y (C)","Egzamin 2024"],
["m","Ułamki i liczby mieszane","Wartość wyrażenia (3,5 − 2¼) : (−5) jest równa",["−1/4","1/4","−5/4","5/4"],0,"1) 2¼ = 2,25, więc 3,5 − 2,25 = 1,25\n2) 1,25 : (−5) = −0,25\n3) −0,25 = −1/4"],

function start(mode,src){

function pick(k){
 if(run.ans)return;run.ans=true;
 var q=run.qs[run.i],ex=run.mode==="exam",good=k===q[4],key=q[0]+"|"+q[1];

}

["Styczeń 2026","Pierwiastki",2,"Dana jest liczba a = (2√3 · √10) : √6.\nWyznacz dwie kolejne liczby całkowite dodatnie, między którymi na osi liczbowej znajduje się liczba a.","1) a = 2√3 · √10 : √6 = 2√30 : √6 = 2√5 = √20\n2) √16 < √20 < √25, czyli 4 < a < 5\nOdpowiedź: liczba a leży między 4 i 5.",["2 pkt: poprawny sposób, obliczenia i wynik: 4 oraz 5","1 pkt: poprawnie obliczona liczba a (np. a = 2√5 = √20)"]],
["Styczeń 2026","Równania i zadania tekstowe",3,"Drużynę harcerską można podzielić na 4-osobowe zespoły. Gdyby drużyna liczyła o 3 osoby mniej, można by ją podzielić na zespoły 5-osobowe, a tych zespołów byłoby o 2 mniej niż 4-osobowych.\nOblicz, ile osób jest w drużynie.","1) x – liczba zespołów 4-osobowych, więc w drużynie jest 4x osób\n2) Po odjęciu 3 osób: 4x − 3 = 5(x − 2)\n3) 4x − 3 = 5x − 10, więc x = 7\n4) Osób: 7 · 4 = 28\nOdpowiedź: w drużynie jest 28 osób.",["3 pkt: poprawny sposób, obliczenia i wynik 28 (może być metoda prób i błędów, jeśli sprawdzasz co najmniej dwie liczby zespołów, w tym 7)","2 pkt: poprawne równanie, np. 4x = 5(x − 2) + 3","1 pkt: poprawne wyrażenia algebraiczne, np. 4x oraz 5(x − 2) + 3"]],
["Styczeń 2026","Bryły",2,"Graniastosłup prawidłowy czworokątny o objętości 567 cm³ ma wysokość 7 cm.\nOblicz pole powierzchni całkowitej tego graniastosłupa.","1) W podstawie jest kwadrat o boku a: V = a² · H\n2) a² = 567 : 7 = 81, więc a = 9 cm\n3) Pc = 2 · 81 + 4 · 9 · 7 = 162 + 252 = 414\nOdpowiedź: pole powierzchni całkowitej to 414 cm².",["2 pkt: poprawny sposób obliczenia pola, obliczenia i wynik 414 cm²","1 pkt: poprawny sposób obliczenia krawędzi podstawy"]],
["Styczeń 2026","Romb i Pitagoras",3,"W rombie ABCD poprowadzono przekątną BD i wysokość opuszczoną z wierzchołka D na bok AB. Bok rombu ma 10 cm, a przekątna BD ma 12 cm.\nOblicz wysokość rombu poprowadzoną z D na bok AB.","1) Przekątne rombu przecinają się pod kątem prostym i dzielą na połowy. Połowa BD to 6 cm\n2) Połowa przekątnej AC: x² + 6² = 10², x = 8 cm, więc AC = 16 cm\n3) Pole rombu: P = (12 · 16) : 2 = 96 cm²\n4) P = a · h, więc h = 96 : 10 = 9,6 cm\nOdpowiedź: wysokość rombu to 9,6 cm.",["3 pkt: poprawny sposób obliczenia wysokości, obliczenia i wynik 9,6 cm","2 pkt: poprawny sposób obliczenia pola rombu","1 pkt: poprawny sposób obliczenia połowy przekątnej AC (8 cm)"]],
["Styczeń 2026","Pitagoras i obwód",3,"Dany jest czworokąt ABCD. Przekątna BD ma długość √18 i dzieli czworokąt na dwa trójkąty prostokątne równoramienne: ABD (kąt prosty przy A) oraz BCD (kąt prosty przy D, |DC| = |DB|).\nOblicz obwód czworokąta ABCD.","1) Trójkąt ABD: |AB| = |AD| = a, a√2 = √18, więc a = √9 = 3\n2) Trójkąt BCD: przyprostokątne √18 i √18, więc |BC|² = 18 + 18 = 36, |BC| = 6\n3) Obwód: 3 + 3 + 6 + √18 = 12 + √18\nOdpowiedź: obwód to 12 + √18 (czyli 12 + 3√2).",["3 pkt: poprawny sposób, obliczenia i wynik 12 + √18 (lub 12 + 3√2)","2 pkt: poprawny sposób obliczenia długości AB oraz BC","1 pkt: poprawny sposób obliczenia AB (lub AD) albo BC"]],
["Egzamin 2025","Ułamki",2,"Liczbę 7/15 zapisano w postaci sumy trzech ułamków zwykłych, z których jeden jest równy 1/5, a drugi 1/6.\nUzasadnij, że trzeci składnik tej sumy można przedstawić w postaci ułamka zwykłego, którego licznik jest równy 1, a mianownik jest liczbą całkowitą dodatnią.","1) Trzeci składnik: 7/15 − (1/5 + 1/6)\n2) Wspólny mianownik 30: 14/30 − (6/30 + 5/30) = 14/30 − 11/30 = 3/30\n3) 3/30 = 1/10\nOdpowiedź: trzeci składnik to 1/10, czyli ułamek z licznikiem 1.",["2 pkt: poprawne uzasadnienie, obliczenia i wynik 1/10","1 pkt: poprawne wyrażenie 7/15 − (1/5 + 1/6) albo równanie 1/5 + 1/6 + x = 7/15"]],
["Egzamin 2025","Równania",3,"Andrzej ma o 28 plakatów więcej od Basi, a Marek ma ich 3 razy mniej od Basi. Andrzej i Marek mają razem 2 razy więcej plakatów od Basi.\nOblicz, ile plakatów ma każde z tych przyjaciół.","1) b – plakaty Basi, b + 28 – Andrzeja, b/3 – Marka\n2) Razem Andrzej i Marek: b + 28 + b/3 = 2b\n3) 28 = 2b − b − b/3 = (2/3)b, więc b = 42\n4) Marek: 42 : 3 = 14, Andrzej: 42 + 28 = 70\nOdpowiedź: Basia 42, Marek 14, Andrzej 70.",["3 pkt: poprawny sposób, obliczenia i trzy wyniki (42, 14, 70) – może być też metoda prób i błędów lub rysunek z częściami","2 pkt: poprawne równanie z jedną niewiadomą, np. b + 28 + b/3 = 2b","1 pkt: poprawne wyrażenia dla trójki dzieci (b, b + 28, b/3)"]],
["Egzamin 2025","Skala i pola",2,"Na ścianie wiszą dwie tablice: mała kwadratowa i duża prostokątna. Mała tablica narysowana w skali 1:20 jest kwadratem o boku 3 cm. Rzeczywiste wymiary dużej tablicy to 240 cm i 90 cm.\nOblicz, ile razy pole dużej tablicy jest większe od pola małej tablicy.","1) Bok małej tablicy w rzeczywistości: 3 · 20 = 60 cm\n2) Pole małej: 60 · 60 = 3600 cm²\n3) Pole dużej: 240 · 90 = 21 600 cm²\n4) 21 600 : 3600 = 6\nOdpowiedź: pole dużej tablicy jest 6 razy większe.",["2 pkt: poprawny sposób, obliczenia i wynik 6 razy","1 pkt: np. poprawny rzeczywisty bok małej tablicy (60 cm) i pole jednej z tablic albo zapis 240 : 60 oraz 90 : 60"]],
["Egzamin 2025","Pola figur",3,"Dany jest kwadrat ABCD o boku 15 cm. Boki AB i CD podzielono na trzy równe części, a boki AD i BC na pięć równych części. Punkt E leży na boku BC tak, że |BE| to 2 z 5 części boku, a punkt F leży na boku CD tak, że |DF| to 2 z 3 części boku. Poprowadzono odcinki AE i AF.\nOblicz pole czworokąta AECF.","1) Jedna część boku BC: 15 : 5 = 3, więc |BE| = 2 · 3 = 6 cm\n2) Jedna część boku CD: 15 : 3 = 5, więc |DF| = 2 · 5 = 10 cm\n3) Pole ABE: ½ · 15 · 6 = 45 cm²\n4) Pole ADF: ½ · 15 · 10 = 75 cm²\n5) Pole AECF = 15² − 45 − 75 = 225 − 120 = 105 cm²\nOdpowiedź: pole czworokąta AECF to 105 cm².",["3 pkt: poprawny sposób, obliczenia i wynik 105 cm²","2 pkt: poprawny sposób obliczenia pola AECF, np. 15² − ½·15·6 − ½·15·10","1 pkt: poprawnie obliczone pole jednego z trójkątów lub trapezów albo zapis, że pole to różnica pola kwadratu i pól trójkątów ABE oraz ADF"]],
["Egzamin 2025","Ostrosłup",3,"Dany jest ostrosłup prawidłowy czworokątny, w którym wysokość ściany bocznej poprowadzona do krawędzi podstawy jest równa 12 cm. Pole powierzchni jednej ściany bocznej tego ostrosłupa jest równe 108 cm².\nOblicz sumę długości wszystkich krawędzi tego ostrosłupa.","1) Krawędź podstawy a: ½ · a · 12 = 108, więc a = 108 : 6 = 18 cm\n2) Krawędź boczna c: wysokość ściany 12 i połowa podstawy 9 tworzą trójkąt prostokątny: c² = 12² + 9² = 225, c = 15 cm\n3) Krawędzi podstawy 4 i bocznych 4: 4 · 18 + 4 · 15 = 72 + 60 = 132\nOdpowiedź: suma długości wszystkich krawędzi to 132 cm.",["3 pkt: poprawny sposób, obliczenia i wynik 132 cm","2 pkt: poprawnie obliczona krawędź podstawy (18 cm) i poprawny sposób obliczenia krawędzi bocznej (Pitagoras)","1 pkt: poprawny sposób obliczenia krawędzi podstawy (108 = ½·a·12) albo zapis Pitagorasa dla krawędzi bocznej"]],
["Egzamin 2024","Ułamki i równania",2,"Ela i Ania dostały w prezencie po jednym zestawie puzzli o takiej samej liczbie elementów. Ela ułożyła 2/5 swoich puzzli, a Ania 1/3 swoich. Dziewczynki ułożyły łącznie 440 elementów.\nOblicz, z ilu elementów składa się jeden zestaw puzzli.","1) x – liczba elementów w zestawie: (2/5)x + (1/3)x = 440\n2) 2/5 + 1/3 = 6/15 + 5/15 = 11/15\n3) (11/15)x = 440, więc x = 440 · 15/11 = 40 · 15 = 600\nOdpowiedź: jeden zestaw ma 600 elementów.",["2 pkt: poprawny sposób, obliczenia i wynik 600 (może być metoda prób i błędów ze sprawdzeniem wszystkich warunków)","1 pkt: poprawne równanie, np. (2/5)x + (1/3)x = 440"]],
["Egzamin 2024","Trapez i Pitagoras",3,"Prostokąt ABCD (A i B na dole, D i C na górze) podzielono na trzy trójkąty: AED, ACE i ABC, gdzie punkt E leży na boku DC. Wiadomo, że |DE| = 15 cm, |AD| = 20 cm, a kąty CAE i ACE trójkąta ACE mają taką samą miarę α.\nOblicz pole trapezu ABCE.","1) Trójkąt AED jest prostokątny: |AE|² = 15² + 20² = 625, więc |AE| = 25 cm\n2) Trójkąt ACE ma dwa równe kąty, więc jest równoramienny: |EC| = |AE| = 25 cm\n3) |DC| = 15 + 25 = 40 cm, więc |AB| = 40 cm\n4) Trapez ABCE: podstawy 40 i 25, wysokość 20: P = ½ · (40 + 25) · 20 = 650\nOdpowiedź: pole trapezu to 650 cm².",["3 pkt: poprawny sposób, obliczenia i wynik 650 cm²","2 pkt: np. Pitagoras dla AE, równość AE = EC i poprawnie obliczone AB","1 pkt: np. poprawnie obliczone AE = 25 cm albo zapisana równość AE = EC, albo wzór na pole trapezu z zależnością podstaw"]],
["Egzamin 2024","Procenty i opakowania",3,"Pan Jan sprzedał w swoim sklepie 120 kg truskawek. Połowę masy sprzedał w dużych opakowaniach (1 kg, cena 18 zł), 10% masy w średnich (0,5 kg, cena 10 zł), a pozostałe truskawki w małych opakowaniach (0,25 kg, cena 6 zł).\nOblicz, jaką kwotę otrzymał pan Jan ze sprzedaży wszystkich truskawek.","1) Duże: 120 : 2 = 60 kg, czyli 60 opakowań: 60 · 18 = 1080 zł\n2) Średnie: 10% · 120 = 12 kg, czyli 12 : 0,5 = 24 opakowania: 24 · 10 = 240 zł\n3) Małe: 120 − 60 − 12 = 48 kg, czyli 48 : 0,25 = 192 opakowania: 192 · 6 = 1152 zł\n4) Razem: 1080 + 240 + 1152 = 2472\nOdpowiedź: pan Jan otrzymał 2472 zł.",["3 pkt: poprawne wyrażenia, obliczenia i wynik 2472 zł","2 pkt: poprawne wyrażenia dla kwot w co najmniej dwóch rodzajach opakowań","1 pkt: poprawnie obliczone masy truskawek w co najmniej dwóch rodzajach opakowań albo kwota za duże opakowania, albo liczba opakowań średnich lub małych"]],
["Podobne (moje)","Ułamki i równania",2,"Janek i Kasia dostali po jednym zestawie klocków o takiej samej liczbie elementów. Janek zbudował 3/8 swoich klocków, a Kasia 1/4 swoich. Razem zbudowali 250 klocków.\nOblicz, z ilu klocków składa się jeden zestaw.","1) x – liczba klocków w zestawie: (3/8)x + (1/4)x = 250\n2) 3/8 + 2/8 = 5/8, więc (5/8)x = 250\n3) x = 250 · 8/5 = 400\nOdpowiedź: jeden zestaw ma 400 klocków.",["2 pkt: poprawny sposób, obliczenia i wynik 400","1 pkt: poprawne równanie, np. (3/8)x + (1/4)x = 250"]],
["Podobne (moje)","Równania",3,"Ola ma o 18 naklejek więcej niż Ewa, a Zosia ma ich 2 razy mniej niż Ewa. Ola i Zosia mają razem 3 razy więcej naklejek niż Ewa.\nOblicz, ile naklejek ma każda z dziewczynek.","1) e – naklejki Ewy, e + 18 – Oli, e/2 – Zosi\n2) Razem Ola i Zosia: e + 18 + e/2 = 3e\n3) 18 = 3e − e − e/2 = 1,5e, więc e = 12\n4) Ola: 12 + 18 = 30, Zosia: 12 : 2 = 6\nSprawdzenie: 30 + 6 = 36 = 3 · 12 ✔\nOdpowiedź: Ewa 12, Ola 30, Zosia 6.",["3 pkt: poprawny sposób, obliczenia i trzy wyniki (12, 30, 6)","2 pkt: poprawne równanie z jedną niewiadomą, np. e + 18 + e/2 = 3e","1 pkt: poprawne wyrażenia dla wszystkich trzech dziewczynek (e, e + 18, e/2)"]],
["Podobne (moje)","Skala i pola",2,"Na ścianie wiszą dwie tablice: mała kwadratowa i duża prostokątna. Mała tablica narysowana w skali 1:25 jest kwadratem o boku 4 cm. Rzeczywiste wymiary dużej tablicy to 200 cm i 150 cm.\nOblicz, ile razy pole dużej tablicy jest większe od pola małej tablicy.","1) Bok małej tablicy w rzeczywistości: 4 · 25 = 100 cm\n2) Pole małej: 100 · 100 = 10 000 cm²\n3) Pole dużej: 200 · 150 = 30 000 cm²\n4) 30 000 : 10 000 = 3\nOdpowiedź: pole dużej tablicy jest 3 razy większe.",["2 pkt: poprawny sposób, obliczenia i wynik 3 razy","1 pkt: np. rzeczywisty bok małej tablicy (100 cm) i pole jednej z tablic albo zapis 200 : 100 oraz 150 : 100"]],
["Podobne (moje)","Pola figur",3,"Dany jest kwadrat ABCD o boku 12 cm. Boki AB i CD podzielono na cztery równe części, a boki AD i BC na trzy równe części. Punkt E leży na boku BC tak, że |BE| to 2 z 3 części boku, a punkt F leży na boku CD tak, że |DF| to 3 z 4 części boku. Poprowadzono odcinki AE i AF.\nOblicz pole czworokąta AECF.","1) Jedna część boku BC: 12 : 3 = 4, więc |BE| = 2 · 4 = 8 cm\n2) Jedna część boku CD: 12 : 4 = 3, więc |DF| = 3 · 3 = 9 cm\n3) Pole ABE: ½ · 12 · 8 = 48 cm²\n4) Pole ADF: ½ · 12 · 9 = 54 cm²\n5) Pole AECF = 144 − 48 − 54 = 42 cm²\nOdpowiedź: pole czworokąta AECF to 42 cm².",["3 pkt: poprawny sposób, obliczenia i wynik 42 cm²","2 pkt: poprawny sposób obliczenia pola AECF, np. 12² − ½·12·8 − ½·12·9","1 pkt: poprawnie obliczone pole jednego z trójkątów lub zapis, że pole to różnica pola kwadratu i pól trójkątów ABE oraz ADF"]],
["Podobne (moje)","Ostrosłup",3,"Dany jest ostrosłup prawidłowy czworokątny, w którym wysokość ściany bocznej poprowadzona do krawędzi podstawy jest równa 24 cm. Pole powierzchni jednej ściany bocznej tego ostrosłupa jest równe 168 cm².\nOblicz sumę długości wszystkich krawędzi tego ostrosłupa.","1) Krawędź podstawy a: ½ · a · 24 = 168, więc a = 168 : 12 = 14 cm\n2) Krawędź boczna c: wysokość ściany 24 i połowa podstawy 7 tworzą trójkąt prostokątny: c² = 24² + 7² = 625, c = 25 cm\n3) Krawędzi podstawy 4 i bocznych 4: 4 · 14 + 4 · 25 = 56 + 100 = 156\nOdpowiedź: suma długości wszystkich krawędzi to 156 cm.",["3 pkt: poprawny sposób, obliczenia i wynik 156 cm","2 pkt: poprawnie obliczona krawędź podstawy (14 cm) i poprawny sposób obliczenia krawędzi bocznej (Pitagoras)","1 pkt: poprawny sposób obliczenia krawędzi podstawy (168 = ½·a·24) albo zapis Pitagorasa dla krawędzi bocznej"]],
["Podobne (moje)","Trapez i Pitagoras",3,"Prostokąt ABCD (A i B na dole, D i C na górze) podzielono na trzy trójkąty: AED, ACE i ABC, gdzie punkt E leży na boku DC. Wiadomo, że |DE| = 9 cm, |AD| = 12 cm, a kąty CAE i ACE trójkąta ACE mają taką samą miarę α.\nOblicz pole trapezu ABCE.","1) Trójkąt AED jest prostokątny: |AE|² = 9² + 12² = 225, więc |AE| = 15 cm\n2) Trójkąt ACE ma dwa równe kąty, więc |EC| = |AE| = 15 cm\n3) |DC| = 9 + 15 = 24 cm, więc |AB| = 24 cm\n4) Trapez ABCE: podstawy 24 i 15, wysokość 12: P = ½ · (24 + 15) · 12 = 234\nOdpowiedź: pole trapezu to 234 cm².",["3 pkt: poprawny sposób, obliczenia i wynik 234 cm²","2 pkt: np. Pitagoras dla AE, równość AE = EC i poprawnie obliczone AB","1 pkt: np. poprawnie obliczone AE = 15 cm albo zapisana równość AE = EC, albo wzór na pole trapezu z zależnością podstaw"]],
["Podobne (moje)","Procenty i opakowania",3,"Pani Ewa sprzedała na targu 80 kg jabłek. 40% masy sprzedała w dużych torbach (2 kg, cena 9 zł), 25% masy w średnich (1 kg, cena 5 zł), a resztę w małych torbach (0,5 kg, cena 3 zł).\nOblicz, jaką kwotę otrzymała pani Ewa ze sprzedaży wszystkich jabłek.","1) Duże: 40% · 80 = 32 kg, czyli 32 : 2 = 16 toreb: 16 · 9 = 144 zł\n2) Średnie: 25% · 80 = 20 kg, czyli 20 toreb: 20 · 5 = 100 zł\n3) Małe: 80 − 32 − 20 = 28 kg, czyli 28 : 0,5 = 56 toreb: 56 · 3 = 168 zł\n4) Razem: 144 + 100 + 168 = 412\nOdpowiedź: pani Ewa otrzymała 412 zł.",["3 pkt: poprawne wyrażenia, obliczenia i wynik 412 zł","2 pkt: poprawne wyrażenia dla kwot w co najmniej dwóch rodzajach toreb","1 pkt: poprawnie obliczone masy jabłek w co najmniej dwóch rodzajach toreb albo liczba toreb jednego rodzaju"]],
["Podobne (moje)","Równania i zadania tekstowe",3,"Klasę można podzielić na 3-osobowe grupy. Gdyby uczniów było o 2 mniej, można by ich podzielić na grupy 4-osobowe, a tych grup byłoby o 3 mniej niż grup 3-osobowych.\nOblicz, ilu uczniów jest w klasie.","1) x – liczba grup 3-osobowych, więc uczniów jest 3x\n2) Po odjęciu 2 uczniów: 3x − 2 = 4(x − 3)\n3) 3x − 2 = 4x − 12, więc x = 10\n4) Uczniów: 10 · 3 = 30\nSprawdzenie: 28 : 4 = 7 grup, czyli o 3 mniej niż 10 ✔\nOdpowiedź: w klasie jest 30 uczniów.",["3 pkt: poprawny sposób, obliczenia i wynik 30 (może być metoda prób i błędów, jeśli sprawdzasz co najmniej dwie liczby grup, w tym 10)","2 pkt: poprawne równanie, np. 3x = 4(x − 3) + 2","1 pkt: poprawne wyrażenia algebraiczne, np. 3x oraz 4(x − 3) + 2"]]
];

 var pool=OT.filter(function(t){return i<0||t[0]===OSRC[i]});

function showOpen(){
 var t=run.ot[run.i];
 app.innerHTML='<div class="row"><button onclick="home()">← Wróć</button><span>'+(run.i+1)+' / '+run.ot.length+'</span></div><div class="card pop"><span class="tag" style="background:var(--m)">✍️ '+t[1]+'</span><span class="tag" style="background:var(--acc)">'+(t[0].indexOf("Podobne")===0?"":"CKE · ")+t[0]+' · '+t[2]+' pkt</span><div class="q">'+t[3].replace(/\n/g,"<br>")+'</div><div class="mut">Rozwiąż na kartce i zapisz obliczenia. Sam wynik bez obliczeń to 0 punktów!</div><button class="pri big" style="text-align:center;margin-top:12px" onclick="revealOpen()">👀 Pokaż rozwiązanie wzorcowe</button><div id="fb"></div></div>';
}
function revealOpen(){
 var t=run.ot[run.i],b='';
 for(var k=0;k<=t[2];k++)b+='<button class="big" style="text-align:center" onclick="scoreOpen('+k+')">'+k+' pkt</button>';
 document.getElementById("fb").innerHTML='<div class="fb"><b>Rozwiązanie wzorcowe:</b><br>'+t[4].replace(/\n/g,"<br>")+'</div><div class="fb"><b>Jak CKE przyznaje punkty (skrót):</b><br>'+t[5].join("<br>")+'</div><p><b>Ile punktów sobie dajesz?</b></p>'+b;
}
function scoreOpen(k){
 var t=run.ot[run.i],key="m|"+t[1],st=S.stats[key]||[0,0];
 st[0]+=k/t[2];st[1]++;S.stats[key]=st;S.xp+=k*5;run.sum+=k;run.max+=t[2];give("open");
 var d=today();if(S.days.indexOf(d)<0)S.days.push(d);
 save();run.i++;
 if(run.i>=run.ot.length){
  app.innerHTML='<div class="card pop" style="text-align:center"><div style="font-size:3rem">✍️</div><h1>'+run.sum+' / '+run.max+' pkt</h1><p>Za każdy punkt +5 XP. Pamiętaj: na egzaminie punkty dają obliczenia, nie sam wynik.</p><div class="mut">Razem: '+S.xp+' XP · poziom '+lv()+'</div><button class="pri big" style="text-align:center;margin-top:14px" onclick="home()">Wróć do menu</button></div>';
 } else showOpen();
}
function next(){run.i++;run.i>=run.qs.length?finish():show()}
function finish(){
 if(run.done)return;run.done=true;clearInterval(timer);
 var n=run.qs.length,p=Math.round(run.ok/n*100),ex=run.mode==="exam",extra="";
 if(ex){S.xp+=20;if(give("exam"))extra+=" 📝";if(p>=90&&give("top"))extra+=" 🏆"}
 var d=today();if(S.days.indexOf(d)<0)S.days.push(d);
 if(streak()>=3&&give("day3"))extra+=" 📅";
 save();
 var em=p>=90?"🏆":p>=70?"🌟":p>=50?"💪":"🌱";
 app.innerHTML='<div class="card pop" style="text-align:center"><div style="font-size:3rem">'+em+'</div><h1>'+run.ok+' / '+n+' ('+p+'%)</h1><p>'+(p>=70?"Świetna robota!":"Każda runda uczy. Spróbuj jeszcze raz!")+(ex?" +20 XP za ukończenie":"")+extra+'</p><div class="mut">Razem: '+S.xp+' XP · poziom '+lv()+'</div><button class="pri big" style="text-align:center;margin-top:14px" onclick="home()">Wróć do menu</button></div>';
}
home();
</script>
</body>
</html>
